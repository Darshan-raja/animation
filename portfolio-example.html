<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG_portfolio - With Animation</title>
    
    <!-- Existing portfolio fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- NEW: Animation dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <link rel="stylesheet" href="intro-animation.css">
    
    <!-- Your existing portfolio styles -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        /* Simplified portfolio styles for demo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }
        
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            padding: 1rem 0;
            z-index: 1000;
        }
        
        .navbar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-brand {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-link {
            color: #a0a0a0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #00d4ff;
        }
        
        main {
            padding-top: 80px;
        }
        
        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }
        
        .home {
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.03) 0%, transparent 70%);
        }
        
        .home-content {
            max-width: 1200px;
            text-align: center;
        }
        
        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }
        
        .accent {
            background: linear-gradient(90deg, #00d4ff, #ff00ff, #00d4ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-subtitle {
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 1.5rem;
        }
        
        .hero-desc {
            font-size: 1.2rem;
            color: #a0a0a0;
            max-width: 600px;
            margin: 0 auto 2rem;
            line-height: 1.8;
        }
        
        .hero-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .hire-btn {
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .hire-btn.primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0a0a0a;
        }
        
        .hire-btn.secondary {
            background: transparent;
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .hire-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- NEW: Intro Animation Overlay (added at the top of body) -->
    <div id="intro-overlay">
        <div id="intro-container"></div>
    </div>

    <!-- NEW: Wrap all your existing portfolio content in this div -->
    <div id="portfolio-content" style="display: none;">
        
        <!-- Your existing portfolio HTML starts here -->
        <header>
            <nav class="navbar">
                <div class="nav-brand">Darshan_DG<span style="color: #00d4ff;">.</span></div>
                <ul class="nav-menu">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#skills" class="nav-link">Skills</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="home" class="section home">
                <div class="home-content">
                    <h1 class="hero-title">I'm <span class="accent">Darshan D G</span></h1>
                    <h2 class="hero-subtitle">Web Developer</h2>
                    <p class="hero-desc">
                        I'm Darshan D G, a passionate Software Developer who enjoys understanding 
                        how systems work from low-level logic circuits to high-level applications.
                    </p>
                    
                    <div class="hero-actions">
                        <button class="hire-btn primary">
                            <span>Hire Me</span>
                        </button>
                        <button class="hire-btn secondary">
                            <span>Download CV</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- More sections (About, Skills, Projects, Contact) go here -->
            
        </main>

        <!-- Your existing scripts -->
        <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
        <!-- <script src="./Services/script.js"></script> -->
        <!-- <script src="./Services/cursoreffect.js"></script> -->
        
    </div>
    <!-- End of portfolio-content wrapper -->

    <!-- NEW: Animation script (added at the very end) -->
    <script src="intro-animation.js"></script>
</body>
</html>
